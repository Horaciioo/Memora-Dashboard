<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="10" />
    <meta name="robots" content="noindex" />
    <title>Memora, mise à jour en cours</title>
    <style>
      :root {
        --ground: #f4f2f7;
        --card: #fdfdfe;
        --ink: #1d1d1f;
        --subtle: #636368;
        --border: #e1e1e6;
        --track: #ece9f1;
        --brand: #ec86a4;
        --accent: #a8355a;
        --mauve: 122 82 204;
        --blue: 47 111 194;
        --pink: 207 63 115;
        --wash: 0.13;
        --color-brand-600: var(--brand);
        --color-ink-subtle: var(--subtle);
        --color-page: var(--card);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #191919;
          --card: #252525;
          --ink: #f5f5f7;
          --subtle: #a1a1a6;
          --border: #2f2f2f;
          --track: #333333;
          --accent: #f8c0d0;
          --wash: 0.16;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'SF Pro Text',
          system-ui,
          'Segoe UI',
          sans-serif;
        background:
          radial-gradient(60% 55% at 12% 8%, rgb(var(--mauve) / var(--wash)), transparent 70%),
          radial-gradient(55% 50% at 92% 14%, rgb(var(--blue) / var(--wash)), transparent 70%),
          radial-gradient(65% 60% at 70% 100%, rgb(var(--pink) / var(--wash)), transparent 70%),
          var(--ground);
      }
      main {
        width: 100%;
        max-width: 440px;
        padding: 40px 36px 36px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--card);
        box-shadow: 0 18px 40px -22px rgb(29 29 31 / 0.28);
      }
      .figure {
        display: block;
        width: 100%;
        max-width: 240px;
        height: auto;
        margin: 0 auto 24px;
        color: var(--ink);
      }
      .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        width: 100%;
        max-width: 440px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand img {
        display: block;
        width: 44px;
        height: 44px;
      }
      .mark {
        color: var(--accent);
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
        line-height: 1.25;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--subtle);
        font-size: 0.9375rem;
        line-height: 1.6;
      }
      .bar {
        position: relative;
        height: 6px;
        margin-top: 28px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--track);
      }
      .bar::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 38%;
        border-radius: 999px;
        background: var(--brand);
        animation: slide 1.6s ease-in-out -0.5s infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(270%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar::after {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
      @media (max-width: 480px) {
        main {
          padding: 32px 24px 28px;
        }
      }
    </style>
  </head>
